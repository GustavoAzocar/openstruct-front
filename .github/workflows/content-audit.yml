name: External content review
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/content-audit.yml'
      - 'scripts/content-audit*.mjs'
  workflow_dispatch:
  schedule:
    - cron: '47 9 * * *'
permissions:
  contents: read
concurrency:
  group: external-content-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/content-audit
          key: content-audit-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: content-audit-v1-
      - run: npm run audit:external
      - name: Report findings without changing content or creating issues
        if: always()
        run: |
          if [ -f out/content-audit/report.md ]; then
            cat out/content-audit/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-audit-external
          path: out/content-audit/
          if-no-files-found: error
          retention-days: 14
